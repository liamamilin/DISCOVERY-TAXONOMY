<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISCOVERY-TAXONOMY — Break Unknown Unknown</title>
  <meta name="description" content="A bilingual library of high-leverage exploration spaces, cognitive blindspots, and AI seed prompts. Break Unknown Unknown." />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <a href="./" class="brand-title" id="brandHome">
          <span class="brand-dot" aria-hidden="true"></span>
          DISCOVERY-TAXONOMY
        </a>
        <span class="brand-slogan" data-i18n="slogan">打破未知的未知</span>
      </div>
      <div class="topbar-actions">
        <button id="langToggle" class="btn btn-ghost btn-sm" type="button" aria-label="Toggle Language">EN</button>
        <button id="themeToggle" class="btn btn-ghost btn-icon btn-sm" type="button" aria-label="Toggle Theme" title="Toggle Theme">◐</button>
        <a href="https://github.com/liamamilin/DISCOVERY-TAXONOMY" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">GitHub ↗</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Compact Single-Row Hero -->
    <section class="hero">
      <div class="hero-copy">
        <h1 data-i18n="heroTitle">答案已经廉价，稀缺的是好题目</h1>
        <p class="hero-sub" data-i18n="heroSub">
          不提供廉价点子列表，只策展高杠杆探索空间、认知盲区与可直接丢给 AI 挖矿的破冰母题。
        </p>
      </div>
      <div class="hero-actions">
        <button id="randomBtn" class="btn btn-random" type="button">
          <span class="random-glyph" aria-hidden="true">✦</span>
          <span data-i18n="randomBtn">随机破盲</span>
          <kbd class="kbd kbd-on-accent">R</kbd>
        </button>
        <div class="hero-stat mono" id="resultCount">18 / 18</div>
      </div>
    </section>

    <!-- Lightweight Command Toolbar (No heavy outer box) -->
    <section class="toolbar" aria-label="Filters">
      <div class="toolbar-primary">
        <div id="arenaTabs" class="arena-tabs" role="tablist"></div>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="搜索母题、盲区、中英文标签..."
          />
          <kbd class="kbd search-kbd" aria-hidden="true">/</kbd>
        </div>
      </div>

      <div class="toolbar-secondary">
        <span class="lens-prefix" data-i18n="lensPrefix">认知透镜</span>
        <div id="lensChips" class="lens-row"></div>
        <button id="resetFiltersBtn" class="btn-link hidden" type="button" data-i18n="resetFilters">重置</button>
      </div>
    </section>

    <section id="cardGrid" class="card-grid" aria-live="polite"></section>

    <section id="emptyState" class="empty-state hidden">
      <p data-i18n="emptyText">没有找到匹配的破盲卡片，试试放宽筛选条件或来一次随机破盲。</p>
      <div class="empty-actions">
        <button id="emptyResetBtn" class="btn btn-ghost" type="button" data-i18n="resetFilters">重置筛选</button>
        <button id="emptyRandomBtn" class="btn btn-random" type="button" data-i18n="randomBtn">随机破盲</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="trilogy">
        <span class="trilogy-label" data-i18n="trilogyLabel">个人 AI 探索三部曲</span>
        <div class="trilogy-links">
          <a href="https://liamamilin.github.io/AI-TASKS-TAXONOMY/" target="_blank" rel="noopener noreferrer">
            <span class="trilogy-index mono">01</span>
            <div>
              <strong>AI-TASKS-TAXONOMY</strong>
              <span data-i18n="trilogyTasks">AI 能做什么</span>
            </div>
          </a>
          <a href="https://liamamilin.github.io/Prompt-taxonomy/#library" target="_blank" rel="noopener noreferrer">
            <span class="trilogy-index mono">02</span>
            <div>
              <strong>Prompt-taxonomy</strong>
              <span data-i18n="trilogyPrompt">怎么让 AI 做</span>
            </div>
          </a>
          <a href="./" class="active">
            <span class="trilogy-index mono">03</span>
            <div>
              <strong>DISCOVERY-TAXONOMY</strong>
              <span data-i18n="trilogyDiscovery">该去探索什么</span>
            </div>
          </a>
        </div>
      </div>
      <div class="footer-meta">
        <span class="mono">Break Unknown Unknown</span>
        <span class="sep">·</span>
        <span class="kbd-legend">
          <kbd class="kbd">/</kbd> <span data-i18n="kbdSearch">搜索</span>
          <kbd class="kbd">R</kbd> <span data-i18n="kbdRandom">随机破盲</span>
          <kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> <span data-i18n="kbdNav">翻卡</span>
        </span>
        <span class="sep">·</span>
        <a href="https://github.com/liamamilin/DISCOVERY-TAXONOMY/blob/main/docs/CARD_GENERATOR_PROMPT.md" target="_blank" rel="noopener noreferrer" data-i18n="contributeLink">提交新破盲卡 ↗</a>
      </div>
    </div>
  </footer>

  <!-- Mining Workbench Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-badges" id="modalBadges"></div>
        <div class="modal-header-actions">
          <div class="modal-nav-group">
            <button id="modalPrevBtn" class="btn btn-ghost btn-icon btn-sm" type="button" title="Previous (←)" aria-label="Previous">←</button>
            <button id="modalNextBtn" class="btn btn-ghost btn-icon btn-sm" type="button" title="Next (→)" aria-label="Next">→</button>
            <button id="modalRandomBtn" class="btn btn-ghost btn-sm" type="button" title="Random (R)">
              <span aria-hidden="true">↻</span>
              <span data-i18n="modalRandom">再随机</span>
            </button>
          </div>
          <button id="modalShareBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="shareCard">分享</button>
          <button id="modalCloseBtn" class="btn btn-ghost btn-icon btn-sm" type="button" title="Close (ESC)" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
